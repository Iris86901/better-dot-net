[package]
name = "better-dot-net"
version = "0.2.0"
edition = "2024"
publish = false
default-run = "better-dot-net"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "form", "json"] }
bytes = "1"
base64 = { version = "0.22", optional = true }
oauth-as = { path = "vendor/oauth-as", features = ["axum", "cimd", "resource-metadata", "bdn-snapshot"], optional = true }
ring = { version = "0.17", optional = true }
time = { version = "0.3", features = ["formatting"], optional = true }
http = "1"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
hmac = "0.12"
rustls-native-certs = "0.8"
ipnet = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
wisp-mux = { git = "https://github.com/MercuryWorkshop/epoxy-tls", rev = "9cde724aea1a0f5e46b1c962b3d19ca1389af074", default-features = false }

[dependencies.hyper]
version = "1"
features = ["client", "http1"]

[dependencies.hyper-util]
version = "0.1"
features = ["tokio"]

[dependencies.http-body-util]
version = "0.1"

[dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = ["ring", "tls12"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[features]
wss-probe = ["dep:tokio-tungstenite"]
advanced = ["tokio-util/io", "dep:base64", "dep:ring", "dep:time", "dep:oauth-as"]
collab-cli = ["dep:tokio-tungstenite"]
terminal-cli = []

[dependencies.tokio-tungstenite]
version = "0.29"
features = ["rustls-tls-native-roots"]
optional = true

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]

[[bin]]
name = "bdn-wss-probe"
path = "src/bin/wss_probe.rs"
required-features = ["wss-probe"]

[[bin]]
name = "bdn-collab"
path = "src/bin/bdn-collab.rs"
required-features = ["advanced"]

[[bin]]
name = "bdn"
path = "src/bin/bdn.rs"
required-features = ["collab-cli"]

[[bin]]
name = "bdn-terminal"
path = "src/bin/bdn-terminal.rs"
required-features = ["terminal-cli"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
